<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QODIQA — Tenant Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#080808;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;padding:24px;
}
.wrap{width:100%;max-width:760px;margin:0 auto}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.logo{font-size:11px;font-weight:700;letter-spacing:5px;color:#2a2a2a;text-transform:uppercase}
.logout-btn{
  background:#0d0d0d;border:1px solid #1c1c1c;color:#ccc;border-radius:8px;
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
}
.logout-btn:hover{background:#151515;border-color:#282828}

.section{
  background:#0d0d0d;border:1px solid #1c1c1c;border-radius:12px;
  padding:22px 22px;margin-bottom:18px;
}
.section h2{font-size:14px;font-weight:700;color:#ddd;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #161616;font-size:13px}
.row:last-child{border-bottom:none}
.row .k{color:#777}
.row .v{color:#eee;text-align:right;word-break:break-word}

.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-healthy,.badge-active,.badge-granted{background:#0d1f12;color:#5fd77f;border:1px solid #1c3a24}
.badge-warning{background:#241c0d;color:#e0b355;border:1px solid #3a2e1c}
.badge-critical,.badge-revoked{background:#241010;color:#e07070;border:1px solid #3a1c1c}
.badge-suspended{background:#1a1a24;color:#a3a3e0;border:1px solid #2c2c3a}

.empty{color:#555;font-size:13px;padding:6px 0}
.loading{color:#555;font-size:13px}
.error-banner{
  background:#1a0d0d;border:1px solid #3a1c1c;border-radius:10px;
  padding:12px 14px;font-size:13px;color:#f5a3a3;margin-bottom:18px;
}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#777;font-weight:600;padding:6px 8px;border-bottom:1px solid #1c1c1c;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:8px 8px;border-bottom:1px solid #161616;color:#ddd}
tr:last-child td{border-bottom:none}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <span class="logo">QODIQA · Tenant Portal</span>
    <button id="logout-btn" class="logout-btn">Sign out</button>
  </header>

  <main>
    <div id="error-banner" class="error-banner" hidden></div>

    <section class="section" id="identity-section">
      <h2>Identity</h2>
      <div class="loading">Loading…</div>
    </section>

    <section class="section" id="keys-section">
      <h2>Signing keys</h2>
      <div class="loading">Loading…</div>
    </section>

    <section class="section" id="consent-section">
      <h2>Consent</h2>
      <div class="loading">Loading…</div>
    </section>
  </main>

</div>
<script src="/js/common/esc.js"></script>
<script src="/js/tenant-portal.js"></script>
</body>
</html>
