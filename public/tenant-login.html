<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QODIQA — Tenant Portal Sign In</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#080808;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 24px;
}
.wrap{width:100%;max-width:400px}
.logo{font-size:11px;font-weight:700;letter-spacing:5px;color:#2a2a2a;
  text-transform:uppercase;margin-bottom:10px;text-align:center}
.headline{font-size:24px;font-weight:800;text-align:center;line-height:1.3;margin-bottom:28px}

.card{
  background:#0d0d0d;border:1px solid #1c1c1c;border-radius:12px;
  padding:28px 24px;
}
.error{
  background:#1a0d0d;border:1px solid #3a1c1c;border-radius:10px;
  padding:12px 14px;font-size:13px;line-height:1.5;color:#f5a3a3;
  margin-bottom:18px;
}

.btn{
  display:block;width:100%;padding:14px 15px;background:#fff;
  color:#080808;border:none;border-radius:10px;
  font-size:14px;font-weight:700;text-decoration:none;text-align:center;
  cursor:pointer;transition:opacity .12s;
}
.btn:hover{opacity:.9}

.hint{margin-top:16px;font-size:12px;line-height:1.6;color:#666;text-align:center}
.footer{margin-top:28px;text-align:center;font-size:12px;color:#333}
</style>
</head>
<body>
<div class="wrap">
<main>

  <p class="logo">QODIQA</p>
  <h1 class="headline">Tenant Portal</h1>

  <div class="card">
    <div id="error-box" class="error" hidden></div>
    <a class="btn" href="/tenant-portal/login">Sign in with your identity provider</a>
    <p class="hint">Single sign-on via your organization's identity provider. No QODIQA-specific password is required.</p>
  </div>

  <p class="footer">Operational / API administration uses a separate, ops-key-authenticated surface — this page is for tenant self-service only.</p>

</main>
</div>
<script src="/js/common/esc.js"></script>
<script src="/js/tenant-login.js"></script>
</body>
</html>
