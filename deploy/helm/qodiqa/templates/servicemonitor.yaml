{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "qodiqa.fullname" . }}
  labels:
    {{- include "qodiqa.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "qodiqa.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      {{- with .Values.monitoring.serviceMonitor.bearerTokenSecret }}
      {{- if .name }}
      authorization:
        type: Bearer
        credentials: { name: {{ .name | quote }}, key: {{ .key | quote }} }
      {{- end }}
      {{- end }}
{{- end }}
