{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qodiqa.fullname" . }}
  labels:
    {{- include "qodiqa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qodiqa.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { port: {{ .Values.gateway.port }}, protocol: TCP }
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:   # DNS
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:   # PostgreSQL and Redis
        - { port: {{ .Values.postgres.port }}, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 6380, protocol: TCP }
    - to:      # AI providers (HTTPS)
        {{- range .Values.networkPolicy.providerEgressCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { port: 443, protocol: TCP }
{{- end }}
