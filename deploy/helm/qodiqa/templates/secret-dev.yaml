{{- if and (eq .Values.profile "development") .Values.secrets.createDevSecret (not .Values.secrets.existingSecret) }}
# DEVELOPMENT ONLY: throw-away values generated at install time. Never used by the production profile.
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-dev-secrets" (include "qodiqa.fullname" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qodiqa.fullname" . }}-dev-secrets
  labels:
    {{- include "qodiqa.labels" . | nindent 4 }}
  annotations:
    # a pre-install hook resource, so that it exists when the migration hook runs; it stays (and keeps its values) across upgrades
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k := list "key-encryption-key" "execution-invariant-secret" "dsr-pseudonym-pepper" }}
  {{ $k }}: {{ if and $existing (hasKey $existing.data $k) }}{{ index $existing.data $k | b64dec | quote }}{{ else }}{{ randAlphaNum 40 | sha256sum | quote }}{{ end }}
  {{- end }}
  client-id: "helm-dev-client"
  redis-password: "dev-redis"
  # runtime role passwords: at least 24 characters (the rotation step refuses shorter ones), generated once and kept across upgrades
  {{- range $k := list "postgres-mig-role-password" "postgres-backup-password" "postgres-password" "postgres-retention-password" "postgres-system-password" "postgres-reporting-password" "postgres-control-password" }}
  {{ $k }}: {{ if and $existing (hasKey $existing.data $k) }}{{ index $existing.data $k | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  {{- end }}
  postgres-mig-password: "dev-pg-mig"
  postgres-admin-password: "dev-pg-mig"
{{- end }}
