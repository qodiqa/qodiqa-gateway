{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "qodiqa.fullname" . }}
  labels:
    {{- include "qodiqa.labels" . | nindent 4 }}
spec:
  {{- (.Files.Get "files/prometheus-rules.yaml" | fromYaml).spec | toYaml | nindent 2 }}
{{- end }}
