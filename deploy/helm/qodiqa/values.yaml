# QODIQA Helm chart values.
#
# The chart renders the same hardened pod as deploy/kubernetes/overlays/distributed: non-root, read-only root filesystem, all capabilities dropped, seccomp RuntimeDefault, no service
# account token, TLS to PostgreSQL and Redis, MAC keyring and keystore from the cluster. It does NOT create production secrets: you supply them (see `secrets`).
#
# profile: production  (default) every secret/TLS input below is required; the gateway's boot rules refuse a weak configuration.
# profile: development  runs the gateway with NODE_ENV=development for local clusters (kind, minikube) against plain-text PostgreSQL/Redis. NEVER for real traffic.

nameOverride: ""
fullnameOverride: ""

profile: production

image:
  repository: ghcr.io/example/qodiqa      # provisional: set to the registry that holds your build of the gateway image
  tag: ""                                 # defaults to the chart's appVersion
  digest: ""                              # when set, used instead of the tag (recommended: pin a digest)
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1                          # production is single-node (the gateway refuses distributed mode in production until); the development profile may use more

gateway:
  port: 3000
  # Environment of the gateway. Defaults mirror deploy/kubernetes/base/configmap.yaml; anything here wins over the defaults the chart computes.
  env: {}
  # Extra environment entries (full EnvVar objects), e.g. provider keys from a Secret.
  extraEnv: []
  # policies.json mounted read-only at /opt/qodiqa/config/policies.json
  policies:
    policies:
      - id: POL-001
        type: REQUIRE_CONSENT
        priority: 10
        enabled: true
        config: { requireValidArtifact: true }
      - id: POL-002
        type: BLOCK_IP
        priority: 20
        enabled: true
        config: { blocklist: [], cidrs: [] }
  # Drain delay while endpoints propagate (preStop), seconds; terminationGracePeriodSeconds must exceed it plus SHUTDOWN_TIMEOUT_MS.
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 60

postgres:
  host: postgres-service
  port: 5432
  database: qodiqa
  user: qodiqa_app
  ssl: true                  # production requires TLS
  sslCaFile: ""              # e.g. /etc/qodiqa-pg-tls/ca.crt (from secrets.pgTlsSecret) to verify a private CA
  waitFor: true              # init container waits for pg_isready

redis:
  url: "rediss://redis-service:6380"
  tls: true
  username: qodiqa
  waitFor: true              # init container waits for a PONG (needs the TLS Secret below in production)

# Secrets are NEVER generated by the chart in the production profile. Create them first and name them here.
secrets:
  # Secret with the gateway's credentials. Required keys (same names as deploy/kubernetes/base/secret.yaml):
  #   key-encryption-key, client-id, redis-password, postgres-password, postgres-retention-password, postgres-system-password,
  #   postgres-reporting-password, postgres-control-password, execution-invariant-secret, dsr-pseudonym-pepper
  #   migration Job (migrations.rotateRolePasswords): postgres-mig-password (the connection), postgres-admin-password, postgres-mig-role-password (new password of role qodiqa_mig), postgres-backup-password
  #   (every runtime role password must be at least 24 characters)
  #   optional: openai-api-key, alert-webhook-url, alert-webhook-secret
  existingSecret: ""
  # Secret holding the MAC keyring file `mac-keys.json` (create with: node scripts/security/macKeyring.js init). Production never creates it at start.
  macKeyringSecret: qodiqa-mac-keyring
  # Secrets with TLS material: redis (ca.crt, client.crt, client.key) and optionally postgres (CA for verification).
  redisTlsSecret: qodiqa-redis-tls
  pgTlsSecret: qodiqa-pg-tls
  # development profile only: render a Secret with throw-away values so a local cluster works without preparation.
  createDevSecret: false

keystore:
  # The signing/transparency keys and stores live here (/opt/qodiqa/data). ReadWriteMany for more than one replica.
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessModes: [ReadWriteMany]
    size: 100Mi
  # false => an emptyDir (development profile and tests only: keys vanish with the pod)
  useEmptyDir: false
  # The gateway refuses to start with an empty key store. With provision.enabled an init container creates (once, under a lock file in the keystore directory, idempotently) the tenant
  # signing key for QODIQA_CLIENT_ID, the consent-signer key and the transparency key. In production prefer provisioning once by hand (same commands as docs/guides/quickstart.md) so that key creation
  # is a deliberate act under your key-custody rules; leave this false there.
  provision:
    enabled: false
    clientId: ""            # default: the value of the Secret key client-id

# Database migrations run as a Helm hook Job before install/upgrade (node src/infra/postgres/migrate.js).
migrations:
  enabled: true
  # Secret keys for the migration credentials (role that owns the schema); must not be the gateway's runtime role.
  user: qodiqa_mig
  passwordSecretKey: postgres-mig-password
  # The migration chain creates the runtime roles with PUBLISHED placeholder passwords. With rotateRolePasswords (default) the Job sets the real ones from the gateway's Secret and then proves
  # no role still accepts its placeholder (scripts/db/role-credentials.js). This needs an administrative role (CREATEROLE/ADMIN on those roles): name it and its Secret key here.
  # Set it to false only if you rotate the role passwords yourself, before the gateway takes traffic.
  rotateRolePasswords: true
  admin:
    user: ""
    passwordSecretKey: postgres-admin-password
  backoffLimit: 2
  activeDeadlineSeconds: 600

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: qodiqa.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests: { cpu: 1000m, memory: 2304Mi }
  limits: { cpu: 4000m, memory: 3Gi }

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: DoNotSchedule

networkPolicy:
  enabled: true
  # CIDRs/selectors allowed to reach the gateway on its port (default: any pod in the release namespace)
  ingressFrom: []
  # Egress: DNS, PostgreSQL, Redis and HTTPS to the AI providers. Narrow `providerEgressCidrs` for a locked-down cluster.
  providerEgressCidrs: ["0.0.0.0/0"]

monitoring:
  # ServiceMonitor / PrometheusRule need the Prometheus Operator CRDs
  serviceMonitor:
    enabled: false
    interval: 30s
    # /metrics needs the ops credential: name the Secret key that holds a bearer token for Prometheus
    bearerTokenSecret: { name: "", key: token }
  prometheusRule:
    enabled: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

# AppArmor runtime/default profile on the gateway container. A node whose kernel has no AppArmor (kind on Docker Desktop, some minimal images) REJECTS such a pod, so the development profile turns it off in ci/dev-values.yaml.
apparmor:
  enabled: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
