# Materialises qodiqa-secrets — the same name and EVERY key of base/secret.yaml (kept equal by
# scripts/__tests__/shippedDeploymentPosture.test.js SD-07) — from the SecretStore above.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qodiqa-secrets
  namespace: qodiqa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: qodiqa-secret-manager
    kind: SecretStore
  target:
    name: qodiqa-secrets
    creationPolicy: Owner
  data:
    - secretKey: key-encryption-key
      remoteRef: { key: qodiqa/production, property: key-encryption-key }
    - secretKey: openai-api-key
      remoteRef: { key: qodiqa/production, property: openai-api-key }
    - secretKey: client-id
      remoteRef: { key: qodiqa/production, property: client-id }
    - secretKey: redis-password
      remoteRef: { key: qodiqa/production, property: redis-password }
    - secretKey: postgres-password
      remoteRef: { key: qodiqa/production, property: postgres-password }
    - secretKey: postgres-backup-password
      remoteRef: { key: qodiqa/production, property: postgres-backup-password }
    - secretKey: backup-encryption-key
      remoteRef: { key: qodiqa/production, property: backup-encryption-key }
    - secretKey: backup-hmac-key
      remoteRef: { key: qodiqa/production, property: backup-hmac-key }
    - secretKey: postgres-retention-password
      remoteRef: { key: qodiqa/production, property: postgres-retention-password }
    - secretKey: execution-invariant-secret
      remoteRef: { key: qodiqa/production, property: execution-invariant-secret }
    - secretKey: postgres-mig-password
      remoteRef: { key: qodiqa/production, property: postgres-mig-password }
    - secretKey: postgres-system-password
      remoteRef: { key: qodiqa/production, property: postgres-system-password }
    - secretKey: postgres-reporting-password
      remoteRef: { key: qodiqa/production, property: postgres-reporting-password }
    - secretKey: postgres-control-password
      remoteRef: { key: qodiqa/production, property: postgres-control-password }
    - secretKey: dsr-pseudonym-pepper
      remoteRef: { key: qodiqa/production, property: dsr-pseudonym-pepper }
    - secretKey: alert-webhook-url
      remoteRef: { key: qodiqa/production, property: alert-webhook-url }
