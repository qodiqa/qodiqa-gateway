# External Secrets reference overlay. EXAMPLE — opt-in, not applied by default.
#
# Replaces the plaintext base64 Opaque Secret (base/secret.yaml, qodiqa-secrets) with one materialised by the External
# Secrets Operator from YOUR secret manager (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault, Vault, …):
# the base Secret is deleted from the render and an ExternalSecret of the same name and keys takes its place, so every
# workload's secretKeyRef keeps working unchanged. Configure the SecretStore for your provider (see its own docs); the
# remote key paths below are placeholders. Nothing here has been run against a real secret manager (UNPROVEN).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../single-node
  - secretstore.yaml
  - externalsecret.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: qodiqa-secrets
        namespace: qodiqa
  # secretstore.yaml authenticates as ServiceAccount `qodiqa`, which now exists
  # (base/serviceaccount.yaml). Bind it to your cloud identity — AWS IRSA shown; for GKE use
  # iam.gke.io/gcp-service-account, for AKS azure.workload.identity/client-id. Placeholder value: replace it.
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: qodiqa
        namespace: qodiqa
        annotations:
          eks.amazonaws.com/role-arn: REPLACE_WITH_SECRET_MANAGER_READER_ROLE_ARN
