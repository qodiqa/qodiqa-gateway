apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qodiqa
  namespace: qodiqa
  annotations:
    cert-manager.io/cluster-issuer: REPLACE_WITH_YOUR_CLUSTER_ISSUER
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # SSE streaming (/ai/chat with stream:true): never buffer, allow long-lived responses
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [REPLACE_WITH_YOUR_HOSTNAME]
      secretName: qodiqa-tls
  rules:
    - host: REPLACE_WITH_YOUR_HOSTNAME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qodiqa
                port:
                  name: http
