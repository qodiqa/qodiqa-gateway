# monitoring overlay secrets — placeholders; replace before applying.
#   ops-token:     QODIQA_OPS_TOKEN (required by production boot while the diagnostics plane is open). 32+ chars.
#   scrape-token:  the Prometheus bearer credential — a per-operator API key (ok_<64 hex>) of a dedicated viewer user.
apiVersion: v1
kind: Secret
metadata:
  name: qodiqa-ops
  namespace: qodiqa
type: Opaque
stringData:
  ops-token: REPLACE_WITH_REAL_OPS_TOKEN_BEFORE_DEPLOY
---
apiVersion: v1
kind: Secret
metadata:
  name: qodiqa-prometheus-scrape
  namespace: qodiqa
type: Opaque
stringData:
  token: REPLACE_WITH_A_VIEWER_OPERATOR_API_KEY_BEFORE_DEPLOY
