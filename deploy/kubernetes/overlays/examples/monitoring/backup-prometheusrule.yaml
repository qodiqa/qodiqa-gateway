# ER 2026-10-06: alerts on BACKUP health. Not gateway metrics: scripts/pg-backup.sh writes them to a Prometheus
# textfile-collector file (QODIQA_BACKUP_METRICS_FILE; labels mode, tier), so they are kept out of the gateway rule
# (prometheusrule.yaml, whose metrics SD-06 requires the gateway to register). Requires node-exporter's textfile
# collector to read the backup job's metrics file.
# 2026-10-06: DR-job alerts (scripts/dr/backup.js, verify.js, cycle.js write the unlabelled
# qodiqa_dr_* textfile metrics) and a runbook_url on every rule. The DR alerts are only as good as the DR metrics files:
# while backup.js and verify.js share one textfile, the later writer replaces the earlier one's series (DR
# half).
# phase 11 (requested by; verified against the
# writers): pg-backup.sh writes one file per (mode, tier) with qodiqa_pg_backup_{success,last_run_timestamp_seconds,
# size_bytes}{mode,tier}; pg-wal-archive.sh writes the UNLABELLED qodiqa_wal_archive_{success,
# last_segment_timestamp_seconds} (every run) and _verify_{success,age_seconds} (--verify runs, and 0 on any failure);
# backup-audit-log.sh writes the UNLABELLED qodiqa_audit_log_backup_{success,last_run_timestamp_seconds,size_bytes}
# (backup and verify modes, self-hosted/systemd only — no Kubernetes CronJob, so those series are absent there and the
# rules stay silent). Textfile metrics have no default-0 series: a rule can only fire after a writer has run.
# last_run_timestamp is written on failures too (failures are caught by the *_success == 0 rules); the staleness rules
# catch a job that has STOPPED running.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qodiqa-backup
  namespace: qodiqa
  labels:
    app.kubernetes.io/name: qodiqa
spec:
  groups:
    - name: qodiqa.backup
      rules:
        - alert: QodiqaBackupFailed
          expr: qodiqa_pg_backup_success{mode="full"} == 0
          labels: { severity: critical }
          annotations: { summary: "The most recent full PostgreSQL backup failed (pg-backup.sh fails closed: no encrypted, sealed backup was written)", runbook_url: "docs/operations/backup-runbook.md#32-kubernetes-cronjob-for-database-backup" }
        # Per-tier limits = pg-backup.sh verify's own defaults (daily 26 h, weekly 8 d, monthly 32 d); the previous single
        # 26 h limit fired permanently for the weekly and monthly tiers.
        - alert: QodiqaBackupStale
          expr: (time() - max by (tier) (qodiqa_pg_backup_last_run_timestamp_seconds{mode="full",tier="daily"}) > 93600) or (time() - max by (tier) (qodiqa_pg_backup_last_run_timestamp_seconds{mode="full",tier="weekly"}) > 691200) or (time() - max by (tier) (qodiqa_pg_backup_last_run_timestamp_seconds{mode="full",tier="monthly"}) > 2764800)
          labels: { severity: warning }
          annotations: { summary: "A full PostgreSQL backup tier has not run within its schedule (daily 26 h, weekly 8 d, monthly 32 d)", runbook_url: "docs/operations/alert-runbooks.md#backups" }
        - alert: QodiqaBackupVerifyFailed
          expr: qodiqa_pg_backup_success{mode="verify"} == 0
          labels: { severity: critical }
          annotations: { summary: "pg-backup.sh verify failed (seal, decrypt, coverage or staleness) — the newest backup of that tier is not proven restorable", runbook_url: "docs/operations/alert-runbooks.md#backups" }
        - alert: QodiqaBackupVerifyStale
          expr: time() - max by (tier) (qodiqa_pg_backup_last_run_timestamp_seconds{mode="verify"}) > 93600
          labels: { severity: warning }
          annotations: { summary: "The daily backup verification job has not run for more than 26 hours", runbook_url: "docs/operations/alert-runbooks.md#backups" }
        - alert: QodiqaBackupMetricsAbsent
          expr: absent(qodiqa_pg_backup_last_run_timestamp_seconds{mode="full"})
          for: 26h
          labels: { severity: warning }
          annotations: { summary: "No backup metrics at all: the backup job has never run, or its metrics file is not collected", runbook_url: "docs/operations/backup-runbook.md#32-kubernetes-cronjob-for-database-backup" }
    - name: qodiqa.wal-archive
      rules:
        # Every pg-wal-archive.sh failure (segment archive OR --verify) goes through alert_failure(): one
        # WAL_ARCHIVE_VERIFY_FAILED event and BOTH success gauges 0. The next successfully archived segment rewrites the file
        # with success 1 and WITHOUT the verify fields, so the rule reads both (one alert, not two).
        - alert: QodiqaWalArchiveVerifyFailed
          expr: (qodiqa_wal_archive_success == 0) or (qodiqa_wal_archive_verify_success == 0)
          labels: { severity: critical }
          annotations: { summary: "WAL archiving or its --verify check failed (WAL_ARCHIVE_VERIFY_FAILED: segment not archived, newest segment stale, or seal error) — point-in-time recovery has a gap", runbook_url: "docs/operations/alert-runbooks.md#wal-archiving" }
        - alert: QodiqaWalArchiveMetricsStale
          expr: time() - qodiqa_wal_archive_last_segment_timestamp_seconds > 1800
          labels: { severity: warning }
          annotations: { summary: "Neither WAL archiving nor its 5-minute --verify job has written metrics for 30 minutes (the verify CronJob is not running)", runbook_url: "docs/operations/alert-runbooks.md#wal-archiving" }
    - name: qodiqa.audit-log-backup
      rules:
        - alert: QodiqaAuditLogBackupFailed
          expr: qodiqa_audit_log_backup_success == 0
          labels: { severity: critical }
          annotations: { summary: "backup-audit-log.sh backup or verify failed (AUDIT_LOG_BACKUP_FAILED) — the file-authoritative audit chain is not being backed up (single-node, self-hosted)", runbook_url: "docs/operations/alert-runbooks.md#audit-log-backup" }
        - alert: QodiqaAuditLogBackupStale
          expr: time() - qodiqa_audit_log_backup_last_run_timestamp_seconds > 1800
          labels: { severity: warning }
          annotations: { summary: "The 5-minute audit-log backup has not run for 30 minutes (systemd timer stopped)", runbook_url: "docs/operations/alert-runbooks.md#audit-log-backup" }
    - name: qodiqa.dr
      rules:
        - alert: QodiqaDrBackupFailed
          expr: qodiqa_dr_backup_success == 0
          labels: { severity: critical }
          annotations: { summary: "The most recent DR backup (scripts/dr/backup.js) failed", runbook_url: "docs/operations/backup-restore-validation.md#7-failure-scenarios" }
        - alert: QodiqaDrBackupStale
          expr: time() - qodiqa_dr_backup_last_success_timestamp_seconds > 93600
          labels: { severity: warning }
          annotations: { summary: "No successful DR backup for more than 26 hours", runbook_url: "docs/operations/backup-restore-validation.md#3-backup-procedure" }
        - alert: QodiqaDrBackupVerifyFailed
          expr: qodiqa_dr_backup_verify_success == 0
          labels: { severity: critical }
          annotations: { summary: "The most recent DR backup verification (scripts/dr/verify.js) failed", runbook_url: "docs/operations/backup-restore-validation.md#6-integrity-verification" }
        - alert: QodiqaDrRestoreValidationFailed
          expr: qodiqa_dr_restore_validation_success == 0
          labels: { severity: critical }
          annotations: { summary: "The most recent DR restore validation cycle (scripts/dr/cycle.js) failed", runbook_url: "docs/operations/backup-restore-validation.md#5-validation-procedure" }
