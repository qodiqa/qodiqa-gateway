# Vault Transit credentials — TEMPLATE ONLY, same rules as base/secret.yaml:
# do NOT commit real values; prefer External Secrets Operator / Sealed
# Secrets / SOPS over raw `kubectl apply` in production.
#
# AppRole (role_id + secret_id) is the preferred auth method — see
# src/infra/keys/providers/vault.js's _buildVaultClient(): it is tried first
# and a static VAULT_TOKEN is only a fallback for the AppRole fields being
# absent. Prefer AppRole in production; a static root/periodic token is
# harder to rotate and audit per-workload.
#
apiVersion: v1
kind: Secret
metadata:
  name: qodiqa-vault-transit-secrets
  namespace: qodiqa
  labels:
    app.kubernetes.io/name:      qodiqa
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Preferred: AppRole credentials (base64-encoded).
  # Generate role_id/secret_id via: vault write auth/approle/role/qodiqa ...
  # Placeholders below are valid base64 of REPLACE_ME markers (not real
  # credentials) so this manifest is schema-valid as shipped --
  # / Defect 2 and
  # base/secret.yaml's matching fix for the full rationale.
  vault-role-id:   UkVQTEFDRV9XSVRIX1JFQUxfVkFVTFRfQVBQUk9MRV9ST0xFX0lEX0JFRk9SRV9ERVBMT1k=
  vault-secret-id: UkVQTEFDRV9XSVRIX1JFQUxfVkFVTFRfQVBQUk9MRV9TRUNSRVRfSURfQkVGT1JFX0RFUExPWQ==

  # Fallback only — used when vault-role-id/vault-secret-id are absent from
  # the patched env (see statefulset-patch.yaml). Leave this key present but
  # set to a harmless placeholder if you're using AppRole, since the
  # Secret's key set is fixed at apply time.
  vault-token: UkVQTEFDRV9XSVRIX1JFQUxfVkFVTFRfVE9LRU5fQkVGT1JFX0RFUExPWV9PUFRJT05BTA==
