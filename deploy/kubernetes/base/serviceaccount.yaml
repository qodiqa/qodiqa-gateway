# QODIQA ServiceAccounts.
#
# Before this file no workload declared a ServiceAccount: every pod ran as the namespace `default` SA, and
# referenced an SA named `qodiqa` that did not exist. Two dedicated,
# token-less accounts now exist:
#   qodiqa         — the gateway (overlays/single-node StatefulSet, overlays/distributed Deployment). Attach any
#                    workload-identity / IRSA annotation HERE.
#   qodiqa-backup  — every backup / DR CronJob in backup-cronjobs.yaml, so backup pods never share an identity
#                    (or a future RBAC binding) with the request-serving gateway.
# Neither needs the Kubernetes API: token automount is off on the SA AND on every pod spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qodiqa
  namespace: qodiqa
  labels:
    app.kubernetes.io/name:      qodiqa
    app.kubernetes.io/component: gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qodiqa-backup
  namespace: qodiqa
  labels:
    app.kubernetes.io/name:      qodiqa
    app.kubernetes.io/component: backup
automountServiceAccountToken: false
