# QODIQA Scheduled Backup CronJobs.
#
# Before this file existed, QODIQA shipped a complete PostgreSQL backup
# script (scripts/pg-backup.sh) and a complete file+Postgres DR framework
# (scripts/dr/*.js) with NOTHING actually invoking either one on a schedule
# — see docs/operations/backup-scheduling.md for the full root-cause
# writeup. These CronJobs are the fix: they run the EXISTING scripts
# unmodified (beyond the additive tiered-retention/metrics/alert changes
# also part of this remediation), on a schedule, with fail-closed job
# settings so a failure is always visible and never silently retried away.
#
# Image: qodiqa-backup:1.0.0, built from deploy/docker/backup.Dockerfile at the repo root
# (NOT the production Dockerfile's image — that image deliberately strips
# scripts/ and docs/; see deploy/docker/backup.Dockerfile's header comment for why a
# second image exists).
#
# Configuration: every retention count, path, and timeout is sourced from
# backup-configmap.yaml / secret.yaml — nothing is hardcoded in the command
# strings below beyond the mode/tier selector, which IS the intended
# per-CronJob identity (a "daily" CronJob choosing the daily tier is
# configuration, not a magic number). Per-environment schedule overrides
# belong in a Kustomize overlay patch targeting `spec.schedule` /
# `spec.timeZone` — see docs/operations/backup-scheduling.md.
#
# ── Known scope boundary — file-based DR backup / restore validation ────────
# scripts/dr/backup.js and scripts/dr/cycle.js also cover three file-based
# components: the audit chain (audit.log), the policy store
# (policy-store.json), and organizations/tenants caches. In QODIQA's
# documented multi-replica Kubernetes topology (statefulset.yaml), the audit
# log is a per-pod EXCLUSIVE ReadWriteOnce volume and the policy/org/tenant
# files are not persisted to any shared volume at all (see statefulset.yaml
# / pvc.yaml) — a separate CronJob pod has no safe, correct way to read
# them. The qodiqa-dr-backup and qodiqa-dr-restore-validation CronJobs below
# are therefore SCOPED to what a standalone pod can reach: the encrypted key
# store (via the existing ReadWriteMany qodiqa-keystore PVC) and the entire
# PostgreSQL-backed state (every table, including the audit_chain and
# transparency_log_entries mirrors — see docs/protocol/AUDIT-SCHEMA-V8.md
# for why the PG mirror is a valid rebuild source). Their manifests/validation
# results correctly and honestly record auditLog/policyStore/organizations/
# tenants as `present: false` — this is disclosed, expected behavior in this
# topology, not a bug. Operators who need full-fidelity restore validation
# including the per-pod file components should run scripts/dr/cycle.js via
# `kubectl exec` against a live replica instead (documented in
# docs/operations/backup-scheduling.md), where those env vars already point
# at real mounted files.
#
# (post-H113 integration audit) — CORRECTED CLAIM: this comment
# previously said an operator could "distinguish 'the reachable components
# validated cleanly' from 'nothing validated'" via cycle.js's per-probe
# DR_VALIDATE_COMPLETE log line. That was never actually reachable, in
# EITHER of these two CronJobs, before or after validateComponents()'s
# REQUIRED_COMPONENT_MISSING check (pre-H113, for the unconditionally
# `critical` auditLog component) — and, fixed that specific
# defect, restore.js's mode-aware gate defaulting to 'single-node'
# and then finding no restored audit.log (AUDIT_LOG_NOT_RESTORED) — both
# throw and crash the job BEFORE cycle.js ever reaches DR_VALIDATE_COMPLETE.
# qodiqa-dr-restore-validation was therefore failing on every single
# scheduled run, indefinitely, in this topology — not gracefully degrading.
# Fixed by setting QODIQA_DEPLOYMENT_MODE=distributed in
# backup-configmap.yaml (envFrom'd by every CronJob here): this pod's own
# audit evidence is PostgreSQL's audit_chain table regardless of which
# topology overlay the app itself runs under (it can never reach the app's
# per-pod file volume either way — see the paragraph above), so this is the
# factually correct signal to send, not merely a workaround. With it set,
# scripts/dr/cycle.js now genuinely completes RESTORE_COMPLETE for the
# reachable PostgreSQL-authoritative evidence, and DR_VALIDATE_COMPLETE's
# per-probe fields (auditChainValid, policyStoreValid, postgresValid) become
# actually reachable and meaningful, distinguishing "the reachable
# components validated cleanly" from "nothing validated" as originally
# intended.
#
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qodiqa-pg-backup-daily
  namespace: qodiqa
  labels:
    app.kubernetes.io/name:      qodiqa
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"   # Change per-environment via a Kustomize overlay patch
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name:      qodiqa
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: qodiqa-backup   # dedicated token-less SA (base/serviceaccount.yaml)
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-backup
              image: YOUR_REGISTRY/qodiqa-backup:1.0.0   # Pin to a digest in production
              imagePullPolicy: Always
              command: ["/app/scripts/pg-backup.sh", "full", "daily"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              envFrom:
                - configMapRef: { name: qodiqa-backup-config }
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: qodiqa-secrets, key: postgres-backup-password } }
                - name: QODIQA_BACKUP_HMAC_KEY  # dedicated seal key, never the application KEK
                  valueFrom: { secretKeyRef: { name: qodiqa-secrets, key: backup-hmac-key } }
                # encryption at rest (required by qodiqa-backup-config QODIQA_BACKUP_REQUIRE_ENCRYPTION)
                - name: QODIQA_BACKUP_ENCRYPTION_KEY
                  valueFrom: { secretKeyRef: { name: qodiqa-secrets, key: backup-encryption-key } }
                - name: ALERT_WEBHOOK_URL
                  valueFrom: { secretKeyRef: { name: qodiqa-secrets, key: alert-webhook-url, optional: true } }
              volumeMounts:
                - { name: pg-backups, mountPath: /backups/pg }
                - { name: tmp, mountPath: /tmp }
                - { name: pg-tls, mountPath: /etc/qodiqa-pg-tls, readOnly: true }   # optional PG CA (backup-configmap.yaml PGSSLMODE)
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { cpu: 1,    memory: 512Mi }
          volumes:
            - name: pg-backups
              persistentVolumeClaim: { claimName: qodiqa-pg-backups }
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }   #
            - name: pg-tls
              secret: { secretName: qodiqa-pg-tls, optional: true, defaultMode: 0440 }
---
