# Incremental (WAL streaming via pg_basebackup) — requires wal_level=replica,
# archive_mode=on, and REPLICATION privilege for the backup role. See
# scripts/pg-backup.sh's run_incremental_backup() header comment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qodiqa-pg-backup-incremental
  namespace: qodiqa
  labels:
    app.kubernetes.io/name:      qodiqa
    app.kubernetes.io/component: backup
spec:
  # SUSPENDED — pg-backup.sh incremental is unsupported until a decision is made on
  # REPLICATION for qodiqa_backup (the script now refuses it with BACKUP_INCREMENTAL_UNSUPPORTED, exit 2).
  suspend: true
  schedule: "0 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name:      qodiqa
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: qodiqa-backup   # dedicated token-less SA (base/serviceaccount.yaml)
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-backup-incremental
              image: YOUR_REGISTRY/qodiqa-backup:1.0.0
              imagePullPolicy: Always
              command: ["/app/scripts/pg-backup.sh", "incremental"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              envFrom:
                - configMapRef: { name: qodiqa-backup-config }
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: qodiqa-secrets, key: postgres-backup-password } }
                - name: ALERT_WEBHOOK_URL
                  valueFrom: { secretKeyRef: { name: qodiqa-secrets, key: alert-webhook-url, optional: true } }
              volumeMounts:
                - { name: pg-backups, mountPath: /backups/pg }
                - { name: tmp, mountPath: /tmp }
                - { name: pg-tls, mountPath: /etc/qodiqa-pg-tls, readOnly: true }   # optional PG CA (backup-configmap.yaml PGSSLMODE)
              resources:
