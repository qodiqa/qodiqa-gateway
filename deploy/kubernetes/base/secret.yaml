# QODIQA Application Secrets
#
# WARNING: This file is a TEMPLATE only.
# Do NOT commit real secret values to version control.
#
# In production, manage this Secret via:
#   - kubectl create secret generic (from a secrets manager)
#   - External Secrets Operator + AWS Secrets Manager / Vault
#   - Sealed Secrets / SOPS
#   - Kubernetes Secrets Store CSI Driver
#
# All values must be base64-encoded.
# Example: echo -n "my-value" | base64
#
# Every value below is a base64-encoded REPLACE_WITH_REAL_..._BEFORE_DEPLOY
# marker. Replace each one with a real base64-encoded value before applying to
# a cluster.
#
# (This paragraph used to read "Replace every <...> placeholder", which was
# left stale when migrated every key away from angle-bracket
# placeholders to valid base64 -- see the key-encryption-key comment below for
# why. No <...> placeholder remains in this file; the wording is corrected here
# so it cannot mislead again, as it did test/dr/backupScheduling.test.js.)
#
# Shared across both topology overlays (single-node and distributed) — see
# overlays/single-node/ and overlays/distributed/. postgres-password is
# consumed by both overlays' workloads (the distributed Deployment's
# ordering authority; the single-node StatefulSet's PG mirror
# option C) and by the backup CronJobs below.
#
apiVersion: v1
kind: Secret
metadata:
  name: qodiqa-secrets
  namespace: qodiqa
  labels:
    app.kubernetes.io/name:      qodiqa
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Required: 64 hex characters (256-bit AES key encryption key)
  # Generate: openssl rand -hex 32 | base64
  # Placeholder below is real, valid base64 (of a REPLACE_ME marker string,
  # not a real key) so this manifest is schema-valid Kubernetes YAML as
  # shipped -- the angle-bracket placeholder this replaced was NOT valid
  # base64 and made every strict schema validator (kubeconform -strict,
  # kubectl apply --dry-run=server) fail on this file specifically (
  # Defect 2). Still fails
  # obviously at application boot if used as-is (wrong length/format), so
  # the fail-loud "you must replace this" behavior for a real deployment is
  # preserved -- only the manifest's own YAML/schema validity changed.
  key-encryption-key: UkVQTEFDRV9XSVRIX1JFQUxfNjRfSEVYX0NIQVJfS0VLX0JFRk9SRV9ERVBMT1k=

  # Required: real OpenAI API key (starts with sk-)
  openai-api-key: UkVQTEFDRV9XSVRIX1JFQUxfT1BFTkFJX0FQSV9LRVlfQkVGT1JFX0RFUExPWQ==

  # Required: meaningful production identifier for this deployment
  # Example: echo -n "myorg-prod" | base64
  client-id: UkVQTEFDRV9XSVRIX1JFQUxfQ0xJRU5UX0lERU5USUZJRVJfQkVGT1JFX0RFUExPWQ==

  # Required for authenticated Redis deployments
  # Generate: openssl rand -base64 32 | base64
  redis-password: UkVQTEFDRV9XSVRIX1JFQUxfUkVESVNfUEFTU1dPUkRfQkVGT1JFX0RFUExPWQ==

  # Required by overlays/distributed/deployment.yaml
  # (QODIQA_AUDIT_ORDERING_MODE=distributed — PostgreSQL is the audit chain
  # ordering authority; see migration 026 and
  # src/core/audit/distributedOrdering.js), by
  # overlays/single-node/statefulset.yaml (PG mirror + durable evidence
  # stores, option C), and by the qodiqa-dr-restore-validation CronJob
  # (its restore-target writer only).
  postgres-password: UkVQTEFDRV9XSVRIX1JFQUxfUE9TVEdSRVNfQVBQX1BBU1NXT1JEX0JFRk9SRV9ERVBMT1k=

  # password of the dedicated read-only backup role
  # qodiqa_backup (migration 067, BYPASSRLS, SELECT only). Every backup CronJob
  # (pg-backup.sh full/verify/incremental, qodiqa-dr-backup, and the dump side of
  # qodiqa-dr-restore-validation) connects with it; set the same value on the role:
  # ALTER ROLE qodiqa_backup PASSWORD '...'. Never reuse postgres-password here.
  postgres-backup-password: UkVQTEFDRV9XSVRIX1JFQUxfUE9TVEdSRVNfQkFDS1VQX1BBU1NXT1JEX0JFRk9SRV9ERVBMT1k=

  # encryption-at-rest key for scripts/pg-backup.sh (QODIQA_BACKUP_ENCRYPTION_KEY) — 32+ characters, a
  # DIFFERENT value from key-encryption-key and from backup-hmac-key. The backup CronJobs refuse to run while this is
  # still the placeholder. Keep a copy OUTSIDE the cluster: a backup cannot be restored without it.
  # Generate: openssl rand -hex 32 | base64
  backup-encryption-key: UkVQTEFDRV9XSVRIX1JFQUxfQkFDS1VQX0VOQ1JZUFRJT05fS0VZX0JFRk9SRV9ERVBMT1k=

  # the backup integrity-seal key (QODIQA_BACKUP_HMAC_KEY: HMAC-SHA256 over every backup file, encrypt-then-MAC)
  # for scripts/pg-backup.sh and scripts/pg-wal-archive.sh — 32+ characters, a DIFFERENT value from key-encryption-key
  # (the application's KEK, which must not double as a MAC key) and from backup-encryption-key. pg-backup.sh refuses a
  # placeholder, a short key, or one equal to the encryption key. Keep a copy OUTSIDE the cluster: a restore checks
  # the seal first. Backups sealed before this key existed were sealed with key-encryption-key — see
  # docs/operations/backup-scheduling.md ("Seal key").
  # Generate: openssl rand -hex 32 | base64
  backup-hmac-key: UkVQTEFDRV9XSVRIX1JFQUxfQkFDS1VQX0hNQUNfU0VBTF9LRVlfQkVGT1JFX0RFUExPWQ==

  # Required by both overlays' workloads whenever PostgreSQL is
  # enabled — the password of the dedicated `qodiqa_retention` role
  # (migration 038), which must also be set on the role itself via
  # `ALTER ROLE qodiqa_retention PASSWORD ...` (see
  # docs/operations/database-role-management.md). Without it the startup
  # retention privilege check (src/core/audit/retentionPrivilegeCheck.js)
  # fails closed with FATAL AUDIT_RETENTION_PRIVILEGE_CHECK_FAILED on every
  # boot — docker-compose.prod.yml has passed QODIQA_PG_RETENTION_PASSWORD
  # neither Kubernetes workload ever did.
  postgres-retention-password: UkVQTEFDRV9XSVRIX1JFQUxfUE9TVEdSRVNfUkVURU5USU9OX1BBU1NXT1JEX0JFRk9SRV9ERVBMT1k=

  # Required by both overlays' workloads — 64 hex characters
  # (256-bit HMAC-SHA256 key), a DIFFERENT value from key-encryption-key.
  # Not startup-gated, but every POST /ai/chat EXECUTE path throws without it
  # (services/secrets/secretsProvider.js getExecutionInvariantSecret()), so
  # no request can ever reach a provider — reproduced live against the
  # Compose reference topology, which also never passed it through.
  # Generate: openssl rand -hex 32 | base64
  execution-invariant-secret: UkVQTEFDRV9XSVRIX1JFQUxfNjRfSEVYX0NIQVJfRVhFQ1VUSU9OX0lOVkFSSUFOVF9TRUNSRVRfQkVGT1JFX0RFUExPWQ==

  # the production boot validator requires
  # the passwords of every dedicated PostgreSQL role the gateway connects as, and
  # the DSR pseudonym pepper. none of these five keys existed here,
  # so every pod failed boot validation. Each value must also be set on
  # its role (ALTER ROLE … PASSWORD — scripts/db/role-credentials.js --rotate,
  # docs/operations/database-role-management.md) and be ≥ 16 characters and not
  # a placeholder (production refuses both).
  #   postgres-mig-password       → qodiqa_mig       (migration 002) — QODIQA_PG_MIG_PASSWORD
  # kept for the separate migration Job / operator CLI ONLY; no gateway pod
  #       mounts it any more (the gateway never uses it and a production boot refuses it).
  #   postgres-system-password    → qodiqa_system    (migration 060) — QODIQA_PG_SYSTEM_PASSWORD
  #   postgres-reporting-password → qodiqa_reporting (migration 060) — QODIQA_PG_REPORTING_PASSWORD
  #   postgres-control-password   → qodiqa_control   (migration 065) — QODIQA_PG_CONTROL_PASSWORD
  #   dsr-pseudonym-pepper → QODIQA_DSR_PSEUDONYM_PEPPER
  postgres-mig-password: UkVQTEFDRV9XSVRIX1JFQUxfUE9TVEdSRVNfTUlHX1BBU1NXT1JEX0JFRk9SRV9ERVBMT1k=
  postgres-system-password: UkVQTEFDRV9XSVRIX1JFQUxfUE9TVEdSRVNfU1lTVEVNX1BBU1NXT1JEX0JFRk9SRV9ERVBMT1k=
  postgres-reporting-password: UkVQTEFDRV9XSVRIX1JFQUxfUE9TVEdSRVNfUkVQT1JUSU5HX1BBU1NXT1JEX0JFRk9SRV9ERVBMT1k=
  postgres-control-password: UkVQTEFDRV9XSVRIX1JFQUxfUE9TVEdSRVNfQ09OVFJPTF9QQVNTV09SRF9CRUZPUkVfREVQTE9Z
  dsr-pseudonym-pepper: UkVQTEFDRV9XSVRIX1JFQUxfNjRfSEVYX0RTUl9QU0VVRE9OWU1fUEVQUEVSX0JFRk9SRV9ERVBMT1k=

  # Optional: Slack/PagerDuty-compatible webhook URL for
  # scheduled backup/verify/restore-validation failure alerts (see
  # backup-cronjobs.yaml, scripts/pg-backup.sh's ALERT_WEBHOOK_URL, and
  # scripts/dr/alert.js). Treated as a secret — not a ConfigMap value —
  # because most webhook URLs (Slack incoming webhooks in particular) embed
  # a bearer-token-like path segment. Every reference to this key in
  # backup-cronjobs.yaml sets `optional: true`, so omitting it entirely is
  # safe (alerting is simply skipped, not a startup failure).
  # Generate: echo -n "https://hooks.slack.com/services/..." | base64
  alert-webhook-url: UkVQTEFDRV9XSVRIX1JFQUxfQUxFUlRfV0VCSE9PS19VUkxfQkVGT1JFX0RFUExPWV9PUFRJT05BTA==
